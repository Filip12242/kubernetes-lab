[defaults]
inventory           = inventory/hosts.yml
host_key_checking   = False
interpreter_python  = /usr/bin/python3
retry_files_enabled = False
# Readable multi-line output. This used to require the community.general.yaml
# callback, which was removed in community.general 12.0 - it is an option on
# the built-in default callback since ansible-core 2.13.
result_format       = yaml

[privilege_escalation]
become        = True
become_method = sudo
