---
# Baseline configuration every lab node gets, regardless of its cluster role.
# Kubernetes-specific prep (swap, kernel modules, containerd) lands in a
# separate role during Phase B - keep this one about plain machine hygiene.

- name: Install baseline packages
  ansible.builtin.dnf:
    name:
      - vim
      - git
      - curl
      - bind-utils      # dig, nslookup
      - tcpdump         # you will want this during the CNI phase
      - chrony
      - policycoreutils-python-utils   # semanage, for the SELinux work later
    state: present

- name: Set the system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable and start chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started

# etcd is unforgiving about clock skew between control plane nodes, so time
# sync is not optional housekeeping here - it is a cluster prerequisite.
- name: Verify the clock is actually synchronised
  ansible.builtin.command: chronyc tracking
  register: chrony_status
  changed_when: false

- name: Confirm SELinux is still enforcing
  ansible.builtin.command: getenforce
  register: selinux_mode
  changed_when: false
  failed_when: selinux_mode.stdout.strip() != 'Enforcing'

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
