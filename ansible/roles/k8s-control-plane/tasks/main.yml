---

- name: Initialise the control plane
  # Nothing but kubeadm writes admin.conf, so its existence really does mean done.
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --pod-network-cidr={{ pod_cidr }}
      --service-cidr={{ service_cidr }}
      --apiserver-advertise-address={{ ansible_host }}
    creates: /etc/kubernetes/admin.conf

- name: Create ~/.kube for {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Install admin.conf as the user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Fail early if pod_cidr no longer matches what the flannel manifest ships
  ansible.builtin.assert:
    that: pod_cidr == '10.244.0.0/16'
    fail_msg: >
      pod_cidr is {{ pod_cidr }}, but kube-flannel.yml hardcodes 10.244.0.0/16
      in net-conf.json. Patch the manifest too, or pods get unroutable addresses
      while every node still reports Ready.

- name: Apply the flannel CNI manifest
  ansible.builtin.command:
    cmd: "kubectl apply -f https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml"
  # As the login user, for the kubeconfig above - root has none.
  become: false
  register: flannel_apply
  changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"
